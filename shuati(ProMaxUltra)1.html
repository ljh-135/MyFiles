<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>C++理论刷题</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>



    <div class="app-container" id="app">
        <div class="app-header">
            <h1>📚 C++理论 · 刷题</h1>
            <span class="progress-text" id="progressText">1 / 200</span>
        </div>

        <div class="question-area" id="questionArea">
            <div class="q-number" id="qNumber">第 1 题</div>
            <div class="q-text" id="qText">加载题目中...</div>
            <div class="options-grid" id="optionsContainer"></div>
            <div class="feedback-msg" id="feedbackMsg"></div>
        </div>

        <div class="nav-area">
            <button class="nav-btn outline" id="prevBtn" disabled>◀ 上一题</button>
            <button class="nav-btn primary" id="nextBtn">下一题 ▶</button>
        </div>

        <div class="action-row">
            <button class="nav-btn success" id="submitBtn">📊 提交并查看汇总</button>
            <button class="nav-btn outline" id="resetBtn">🔄 重置所有</button>
        </div>

        <div class="summary-container" id="summaryContainer">
            <div class="summary-header">
                <h2>📋 我的作答汇总</h2>
                <span class="summary-stats" id="summaryStats">已答 0 / 0 题</span>
            </div>
            <div class="summary-grid" id="summaryGrid"></div>
            <div class="back-to-quiz">
                <button class="nav-btn outline" id="backBtn">← 返回刷题</button>
            </div>
        </div>
    </div>

<script src="/script.js"></script>
    
</body>

</html>
